name: Calidad visual y accesibilidad
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-qa.yml'
  push:
    branches: [architecture/astro-platform]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/browser-qa.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias del portal
        run: npm ci --no-audit --no-fund
      - name: Instalar herramientas de pruebas en el runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.64.1 @axe-core/playwright@4.14.0
      - name: Instalar Chromium y dependencias del sistema
        run: npx playwright install chromium --with-deps
      - name: Preparar Python para imagen de WhatsApp
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar imagen para compartir el portal
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python scripts/create-social-image.py
      - name: Compilar la web
        run: npm run build
      - name: Probar diseño, navegación y accesibilidad
        run: npx playwright test
      - name: Conservar capturas e informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-visuales
          path: |
            playwright-report/
            test-results/
          retention-days: 14
