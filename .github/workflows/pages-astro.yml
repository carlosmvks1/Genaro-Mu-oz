name: Publicar portal Astro
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/pages-astro.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar para Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Control editorial antes de publicar
        run: node scripts/check-editorial.mjs
      - name: Instalar y crear sitio Astro
        uses: withastro/action@v6
  deploy:
    needs: build
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
